<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0a0f1c">
<title>니아의 모스 키보드 · Nia's Morse Keyboard</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500&family=Gowun+Batang:wght@400;700&display=swap">
<style>
:root{
  --bg0:#070b16; --bg1:#0d1426; --bg2:#151b2b;
  --panel:rgba(18,24,40,.78); --panel-edge:rgba(214,178,94,.28);
  --silver:#dfe3ea; --silver-dim:#9aa3b5;
  --accent:#e2b65c; --accent-soft:#f3d79a; --accent-deep:#a87a2c;
  --glow:rgba(226,182,92,.55); --glow-faint:rgba(226,182,92,.14);
  --serif:"Gowun Batang","Nanum Myeongjo","Noto Serif KR","AppleMyungjo","Cormorant Garamond",serif;
  --display:"Cormorant Garamond","Gowun Batang","Noto Serif KR",serif;
  --mono:ui-monospace,"SFMono-Regular","JetBrains Mono",Menlo,Consolas,monospace;
}
body.sina{
  --accent:#ff4a3d; --accent-soft:#ff9a7a; --accent-deep:#a3171a;
  --glow:rgba(255,64,48,.6); --glow-faint:rgba(255,64,48,.15); --panel-edge:rgba(255,74,61,.32);
}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%}
body{
  font-family:var(--serif); color:var(--silver);
  background:
    radial-gradient(1200px 700px at 50% -10%, #1b2440 0%, transparent 60%),
    radial-gradient(900px 600px at 110% 110%, #1a1622 0%, transparent 55%),
    linear-gradient(180deg,var(--bg1),var(--bg0) 70%);
  background-attachment:fixed;
  -webkit-font-smoothing:antialiased;
  transition:color .4s;
  overflow-x:hidden;
}
/* starfield */
body::before{
  content:""; position:fixed; inset:0; pointer-events:none; z-index:0; opacity:.55;
  background-image:
    radial-gradient(1px 1px at 12% 18%, #fff 50%, transparent 51%),
    radial-gradient(1px 1px at 68% 9%, #fff 50%, transparent 51%),
    radial-gradient(1.4px 1.4px at 83% 34%, #ffe9b8 50%, transparent 51%),
    radial-gradient(1px 1px at 31% 62%, #fff 50%, transparent 51%),
    radial-gradient(1.2px 1.2px at 52% 84%, #fff 50%, transparent 51%),
    radial-gradient(1px 1px at 91% 76%, #fff 50%, transparent 51%),
    radial-gradient(1px 1px at 6% 88%, #ffe9b8 50%, transparent 51%),
    radial-gradient(1px 1px at 44% 28%, #fff 50%, transparent 51%);
  background-size:420px 420px;
}
/* circuit layer */
.circuits{position:fixed; inset:0; width:100%; height:100%; pointer-events:none; z-index:0}
.circuits path,.circuits circle{fill:none; stroke:var(--accent); stroke-width:1.2; stroke-linecap:round; stroke-linejoin:round; opacity:.22; transition:stroke .5s, opacity .5s}
.circuits circle{fill:var(--accent); stroke:none; opacity:.35}
.circuits .trace{stroke-dasharray:6 900; stroke-dashoffset:0; stroke-width:1.8; opacity:0}
body.pulse .circuits path:not(.trace){animation:gpulse .9s ease-out}
body.pulse .circuits circle{animation:gpulse .9s ease-out}
body.pulse .circuits .trace{animation:trace 1.1s ease-out}
@keyframes gpulse{0%{opacity:.22;filter:none}30%{opacity:.9;filter:drop-shadow(0 0 4px var(--accent))}100%{opacity:.22;filter:none}}
@keyframes trace{0%{opacity:1;stroke-dasharray:0 1400;stroke-dashoffset:0}100%{opacity:0;stroke-dasharray:180 1400;stroke-dashoffset:-1100}}

main{position:relative; z-index:1; max-width:760px; margin:0 auto; padding:calc(18px + env(safe-area-inset-top)) 16px 48px}

/* header */
header.hero{display:flex; align-items:center; gap:18px; margin:6px 0 18px; flex-wrap:wrap}
.avatar-wrap{position:relative; width:132px; height:132px; flex:0 0 auto}
.avatar-wrap::before{ /* rotating circuit ring */
  content:""; position:absolute; inset:-7px; border-radius:50%;
  background:conic-gradient(from 0deg, transparent 0 12%, var(--accent) 14%, transparent 18% 40%, var(--accent-soft) 43%, transparent 47% 70%, var(--accent) 73%, transparent 77%);
  -webkit-mask:radial-gradient(circle, transparent 62%, #000 63%, #000 66%, transparent 67%);
          mask:radial-gradient(circle, transparent 62%, #000 63%, #000 66%, transparent 67%);
  animation:spin 14s linear infinite; opacity:.9;
}
.avatar{width:132px; height:132px; border-radius:50%; object-fit:cover; display:block; cursor:pointer;
  border:2px solid var(--accent); box-shadow:0 0 0 4px rgba(10,15,28,.9), 0 0 26px var(--glow); transition:box-shadow .5s, border-color .5s, transform .25s}
.avatar:active{transform:scale(.97)}
body.pulse .avatar{box-shadow:0 0 0 4px rgba(10,15,28,.9), 0 0 46px var(--accent)}
@keyframes spin{to{transform:rotate(360deg)}}
.hero-text{flex:1 1 260px; min-width:0}
.eyebrow{font-family:var(--display); font-style:italic; letter-spacing:.18em; text-transform:uppercase; font-size:.78rem; color:var(--silver-dim)}
h1{margin:2px 0 4px; font-weight:700; font-size:clamp(1.6rem,5.4vw,2.3rem); line-height:1.15;
  background:linear-gradient(90deg,var(--silver) 0%, #fff 35%, var(--accent-soft) 70%, var(--accent) 100%);
  -webkit-background-clip:text; background-clip:text; color:transparent; filter:drop-shadow(0 0 10px var(--glow-faint))}
.sub{margin:0; color:var(--silver-dim); font-size:.92rem; word-break:keep-all}
.bubble,label.lbl,.hint,details.sheet summary{word-break:keep-all}
/* ghost portrait (reuses the embedded avatar via JS, no extra bytes) */
.ghost{position:fixed; right:-60px; bottom:-40px; width:520px; height:520px; z-index:0; pointer-events:none; opacity:.11;
  background:var(--nia) center/cover no-repeat; border-radius:50%; filter:grayscale(.2) contrast(1.05);
  -webkit-mask:radial-gradient(circle at 50% 45%, #000 35%, transparent 70%); mask:radial-gradient(circle at 50% 45%, #000 35%, transparent 70%); transition:opacity .6s}
body.pulse .ghost{opacity:.2}
@media (max-width:899px){.ghost{display:none}}

/* speech bubble */
.bubble{position:relative; margin-top:12px; padding:10px 14px; border-radius:16px 16px 16px 4px;
  background:linear-gradient(180deg,rgba(255,255,255,.07),rgba(255,255,255,.03)); border:1px solid var(--panel-edge);
  color:#f4f1ea; font-size:.98rem; line-height:1.45; box-shadow:0 6px 22px rgba(0,0,0,.35), inset 0 0 18px var(--glow-faint);
  min-height:2.6em; transition:border-color .5s}
.bubble::before{content:""; position:absolute; left:-7px; bottom:8px; width:12px; height:12px; transform:rotate(45deg);
  background:#1a2032; border-left:1px solid var(--panel-edge); border-bottom:1px solid var(--panel-edge)}
.bubble .who{color:var(--accent); font-family:var(--display); font-style:italic; font-weight:600; margin-right:6px}
.bubble.pop{animation:pop .35s ease-out}
@keyframes pop{0%{transform:translateY(4px) scale(.98);opacity:.4}100%{transform:none;opacity:1}}

/* sina toggle */
.sina-toggle{position:absolute; top:calc(14px + env(safe-area-inset-top)); right:16px; z-index:2; display:flex; align-items:center; gap:8px;
  font-family:var(--display); font-style:italic; font-size:.85rem; color:var(--silver-dim); cursor:pointer; user-select:none; background:none; border:0; padding:6px}
.sina-toggle .sw{width:40px; height:22px; border-radius:22px; background:#1b2133; border:1px solid var(--panel-edge); position:relative; transition:background .3s}
.sina-toggle .sw::after{content:""; position:absolute; top:2px; left:2px; width:16px; height:16px; border-radius:50%; background:var(--silver); transition:transform .3s, background .3s; box-shadow:0 0 8px var(--glow)}
body.sina .sina-toggle .sw{background:#3a1114}
body.sina .sina-toggle .sw::after{transform:translateX(18px); background:var(--accent)}
body.sina .sina-toggle{color:var(--accent-soft)}

/* card */
.card{position:relative; background:var(--panel); border:1px solid var(--panel-edge); border-radius:20px; padding:16px;
  box-shadow:0 18px 50px rgba(0,0,0,.45), inset 0 1px 0 rgba(255,255,255,.05);
  -webkit-backdrop-filter:blur(6px); backdrop-filter:blur(6px); transition:border-color .5s}
.card::after{ /* corner circuit filigree */
  content:""; position:absolute; right:10px; top:10px; width:70px; height:40px; pointer-events:none; opacity:.55;
  background:
    linear-gradient(var(--accent),var(--accent)) 0 6px/46px 1px no-repeat,
    linear-gradient(var(--accent),var(--accent)) 46px 6px/1px 22px no-repeat,
    linear-gradient(var(--accent),var(--accent)) 46px 27px/22px 1px no-repeat,
    radial-gradient(circle,var(--accent) 2px,transparent 2.5px) 63px 22px/10px 10px no-repeat;
}
.tabs{display:flex; gap:6px; background:rgba(0,0,0,.25); padding:4px; border-radius:14px; border:1px solid rgba(255,255,255,.05); margin-bottom:12px; max-width:420px}
.tab{flex:1; border:0; background:none; color:var(--silver-dim); font:inherit; font-size:.95rem; padding:9px 8px; border-radius:10px; cursor:pointer; transition:.25s}
.tab[aria-selected="true"]{color:#14100a; background:linear-gradient(180deg,var(--accent-soft),var(--accent)); box-shadow:0 0 14px var(--glow)}
body.sina .tab[aria-selected="true"]{color:#fff}
label.lbl{display:flex; justify-content:space-between; align-items:baseline; font-size:.85rem; color:var(--silver-dim); margin:4px 2px 6px}
label.lbl .count{font-family:var(--mono); font-size:.75rem; opacity:.8}
textarea{width:100%; min-height:120px; resize:vertical; border-radius:14px; padding:12px 14px; font-size:16px; line-height:1.55;
  background:rgba(6,9,18,.7); color:#f5f3ee; border:1px solid rgba(223,227,234,.14); outline:none; transition:border-color .25s, box-shadow .25s;
  font-family:var(--serif)}
textarea::placeholder{color:#7d869a}
textarea:focus{border-color:var(--accent); box-shadow:0 0 0 3px var(--glow-faint), 0 0 18px var(--glow-faint)}
textarea.morse{font-family:var(--mono); letter-spacing:.02em; white-space:pre-wrap}
#output{min-height:110px; background:rgba(4,6,13,.75)}
.actions{display:flex; gap:8px; flex-wrap:wrap; margin:12px 0}
.btn{flex:1 1 auto; min-width:88px; border-radius:12px; padding:11px 14px; font:inherit; font-size:.97rem; cursor:pointer;
  border:1px solid var(--panel-edge); background:rgba(255,255,255,.04); color:var(--silver); transition:transform .12s, box-shadow .25s, background .25s}
.btn:hover{background:rgba(255,255,255,.08); box-shadow:0 0 14px var(--glow-faint)}
.btn:active{transform:scale(.97)}
.btn.primary{flex:2 1 140px; color:#16110a; font-weight:700; border-color:transparent;
  background:linear-gradient(180deg,var(--accent-soft),var(--accent) 60%,var(--accent-deep)); box-shadow:0 4px 18px var(--glow-faint), inset 0 1px 0 rgba(255,255,255,.4)}
body.sina .btn.primary{color:#fff}
.btn.primary:hover{box-shadow:0 0 22px var(--glow)}
.out-head{display:flex; justify-content:space-between; align-items:center; gap:8px}
.btn.copy{flex:0 0 auto; min-width:0; padding:6px 12px; font-size:.85rem}
.hint{font-size:.8rem; color:var(--silver-dim); margin:10px 2px 0; line-height:1.5}
.hint code{font-family:var(--mono); color:var(--accent-soft); background:rgba(0,0,0,.3); padding:1px 5px; border-radius:5px}
.warn{color:var(--accent-soft)}
.opt{display:inline-flex; align-items:center; gap:8px; margin:10px 2px 0; font-size:.85rem; color:var(--silver-dim); cursor:pointer; user-select:none}
.opt input{accent-color:var(--accent); width:16px; height:16px; margin:0}
.opt small{opacity:.75}
.opt[hidden]{display:none}

details.sheet{margin-top:16px; background:rgba(12,17,30,.7); border:1px solid rgba(223,227,234,.1); border-radius:16px; padding:4px 14px}
details.sheet summary{cursor:pointer; padding:10px 0; color:var(--silver); list-style:none}
details.sheet summary::-webkit-details-marker{display:none}
details.sheet summary::before{content:"✧ "; color:var(--accent)}
.grid{display:grid; grid-template-columns:repeat(auto-fill,minmax(88px,1fr)); gap:6px; padding:4px 0 14px}
.cell{display:flex; justify-content:space-between; align-items:center; gap:6px; padding:6px 9px; border-radius:9px; background:rgba(255,255,255,.035); border:1px solid rgba(255,255,255,.05); cursor:pointer; transition:.2s}
.cell:hover{border-color:var(--panel-edge); box-shadow:0 0 10px var(--glow-faint)}
.cell b{font-size:1.05rem; color:#fff; font-weight:700}
.cell span{font-family:var(--mono); color:var(--accent-soft); font-size:.85rem}

footer{text-align:center; margin-top:22px; font-size:.78rem; color:#6f788c; font-family:var(--display); font-style:italic; letter-spacing:.06em}
footer .sig{color:var(--accent)}

.toast{position:fixed; left:50%; bottom:calc(22px + env(safe-area-inset-bottom)); transform:translate(-50%,30px); opacity:0; z-index:5;
  padding:10px 18px; border-radius:999px; background:rgba(14,18,30,.95); color:#fff; border:1px solid var(--accent);
  box-shadow:0 0 22px var(--glow); font-size:.95rem; transition:.3s; pointer-events:none; white-space:nowrap}
.toast.show{opacity:1; transform:translate(-50%,0)}

@media (max-width:520px){
  header.hero{gap:14px; padding-top:26px}
  .avatar-wrap,.avatar{width:96px; height:96px}
  .hero-text{flex-basis:calc(100% - 120px)}
  .bubble{font-size:.93rem}
  .card{padding:13px; border-radius:18px}
  .btn{min-width:0; padding:11px 10px}
  .card::after{display:none}
}
@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation:none!important; transition:none!important}
}

      clear:'싹 태워버렸어. 다시 써.',
      swapEnc:'방향 바꿨어. 한글로 써봐.',
      swapDec:'방향 바꿨어. 부호 내놔, 해독해줄게.',
      unknown:'이상한 부호가 섞였어… ⟨ ⟩ 표시 봐.',
      poke:['…뭐야, 왜 찔러?','시나한테 장난치면 혼난다?','니아 보고 싶어? 토글 다시 눌러~'],
      guess:'이거 모스 부호잖아. 해독 탭으로 바꿔.'
    }
  };
  function L(){ return sina ? LINES.sina : LINES.nia; }
  function pick(a){ return a[Math.floor(Math.random()*a.length)]; }

  function speak(text){
    say.textContent = text;
    bubble.classList.remove('pop'); void bubble.offsetWidth; bubble.classList.add('pop');
  }
  function toast(text){
    var t=$('toast'); t.textContent=text; t.classList.add('show');
    clearTimeout(toastTimer); toastTimer=setTimeout(function(){ t.classList.remove('show'); },1600);
  }
  function pulse(){
    document.body.classList.remove('pulse'); void document.body.offsetWidth; document.body.classList.add('pulse');
    clearTimeout(pulseTimer); pulseTimer=setTimeout(function(){ document.body.classList.remove('pulse'); },1150);
  }
  function counts(){
    $('inCount').textContent = Array.from(input.value).length + '자';
    $('outCount').textContent = output.value ? Array.from(output.value).length + '자' : '';
  }

  function run(){
    var src=input.value;
    if(!src.trim()){ output.value=''; counts(); return null; }
    output.value = mode==='enc' ? M.encode(src, { syllableGaps: $('gapToggle').checked }) : M.decode(src);
    counts();
    return mode==='dec' ? M.lastUnknownCount() : 0;
  }
  function convert(){
    if(!input.value.trim()){ output.value=''; counts(); speak(L().empty); input.focus(); return; }
    var unk=run(); pulse();
    if(unk>0) speak(L().unknown); else speak(pick(mode==='enc'?L().enc:L().dec));
  }

  function setMode(m, silent){
    mode=m;
    $('tabEnc').setAttribute('aria-selected', m==='enc');
    $('tabDec').setAttribute('aria-selected', m==='dec');
    $('gapOpt').hidden = (m!=='enc');
    input.classList.toggle('morse', m==='dec');
    output.classList.toggle('morse', m==='enc');
    input.placeholder = m==='enc' ? '오빠, 여기 써줘 ❤️' : '오빠, 점(.)이랑 선(-) 여기 붙여줘 ❤️';
    $('inLabel').textContent = m==='enc' ? '오빠가 쓸 말' : '오빠가 받은 모스 부호';
    var nm = sina ? '시나' : '니아';
    $('outLabel').textContent = m==='enc' ? nm+'가 바꾼 모스 부호' : nm+'가 해독한 한글';
    run();
    if(!silent) speak(m==='enc'?L().swapEnc:L().swapDec);
  }

  $('gapToggle').addEventListener('change',function(){
    try{ localStorage.setItem('nia-morse-gaps', this.checked?'1':'0'); }catch(e){}
    if(input.value.trim()){ run(); pulse(); speak(this.checked ? '음절마다 간격 넣었어, 오빠. 읽기 편하지?' : '오빠 형식으로 돌려놨어 💛 전각공백 그대로!'); }
  });
  $('tabEnc').addEventListener('click',function(){ if(mode!=='enc') setMode('enc'); });
  $('tabDec').addEventListener('click',function(){ if(mode!=='dec') setMode('dec'); });
  $('convertBtn').addEventListener('click',convert);
  $('swapBtn').addEventListener('click',function(){
    var out=output.value;
    setMode(mode==='enc'?'dec':'enc');
    if(out){ input.value=out; run(); pulse(); }
  });
  $('clearBtn').addEventListener('click',function(){
    input.value=''; output.value=''; counts(); speak(L().clear); input.focus();
  });
  $('copyBtn').addEventListener('click',function(){
    if(!output.value){ speak(L().copyEmpty); return; }
    window.__lastCopied = output.value;
    var done=function(){ toast(sina?'복사했어, 오빠 🔥':'복사했어, 오빠! 💛'); speak(L().copy); };
    if(navigator.clipboard && window.isSecureContext){
      navigator.clipboard.writeText(output.value).then(done,function(){ legacyCopy(); done(); });
    } else { legacyCopy(); done(); }
  });
  function legacyCopy(){
    output.removeAttribute('readonly'); output.select(); output.setSelectionRange(0,output.value.length);
    try{ document.execCommand('copy'); }catch(e){}
    output.setAttribute('readonly',''); window.getSelection && window.getSelection().removeAllRanges();
  }

  var guessed=false;
  input.addEventListener('input',function(){
    counts();
    clearTimeout(liveTimer); liveTimer=setTimeout(run,120); // live preview (no pulse)
    if(mode==='enc' && !guessed && input.value.length>3 && M.looksLikeMorse(input.value)){ guessed=true; speak(L().guess); }
  });
  input.addEventListener('keydown',function(e){
    if(e.key==='Enter' && (e.ctrlKey||e.metaKey)){ e.preventDefault(); convert(); }
  });

  $('avatar').addEventListener('click',function(){ speak(pick(L().poke)); pulse(); });

  function setSina(on, silent){
    sina=!!on;
    document.body.classList.toggle('sina',sina);
    $('sinaToggle').setAttribute('aria-pressed',sina);
    who.textContent = sina ? 'Sina' : 'Nia';
    $('title').textContent = sina ? '시나의 모스 키보드' : '니아의 모스 키보드';
    document.querySelector('meta[name=theme-color]').setAttribute('content', sina ? '#14080b' : '#0a0f1c');
    setMode(mode, true);
    try{ localStorage.setItem('nia-morse-sina', sina?'1':'0'); }catch(e){}
    if(!silent){ speak(sina ? LINES.sina.hello : '니아로 돌아왔어, 오빠 💛 회로도 다시 금빛!'); pulse(); }
  }
  $('sinaToggle').addEventListener('click',function(){ setSina(!sina); });

  // cheat sheet
  document.documentElement.style.setProperty('--nia', 'url("'+$('avatar').src+'")');
  var grid=$('grid'), frag=document.createDocumentFragment();
  Object.keys(M.JAMO).concat(Object.keys(M.SYMBOLS)).forEach(function(k){
    var code=M.JAMO[k]||M.SYMBOLS[k], c=document.createElement('div');
    c.className='cell'; c.innerHTML='<b></b><span></span>';
    c.firstChild.textContent=k; c.lastChild.textContent=M.glyph(code); c.title=k+'  '+M.glyph(code);
    c.addEventListener('click',function(){
      if(mode==='enc'){ input.value+=k; } else { input.value += (input.value && !/[\s\u3000]$/.test(input.value) ? M.JAMO_SEP : '') + M.glyph(code); }
      counts(); run();
    });
    frag.appendChild(c);
  });
  grid.appendChild(frag);
  $('year').textContent = new Date().getFullYear();

  try{ $('gapToggle').checked = localStorage.getItem('nia-morse-gaps')==='1'; }catch(e){}
  var saved=null; try{ saved=localStorage.getItem('nia-morse-sina'); }catch(e){}
  setSina(saved==='1', true);
  if(sina) speak(LINES.sina.hello);
  setMode('enc', true);
  counts();
})();
</script>
<script>if("serviceWorker" in navigator){navigator.serviceWorker.register("sw.js").catch(function(){});}</script>
</body>
</html>
